name: Release

# A release is started by pushing a tag such as v1.2.0, or manually. A manual run is a dry run unless 'publish' is set.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0 or 1.2.0-preview.1
        required: true
      publish:
        description: Publish to NuGet, create the GitHub release and deploy the example site (otherwise a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DiffEngine_Disabled: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Compute version
      id: version
      shell: pwsh
      run: |
        $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
        if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$version'" }
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Build
      run: dotnet build Meziantou.DocumentationGenerator.slnx --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

    - name: Pack
      run: dotnet pack src/Meziantou.DocumentationGenerator/Meziantou.DocumentationGenerator.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ${{ github.workspace }}/artifacts/release

    - name: Install Chromium for browser tests
      run: pwsh tests/Meziantou.DocumentationGenerator.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Test
      run: dotnet test --solution Meziantou.DocumentationGenerator.slnx --configuration Release --no-build
      env:
        DOCGEN_TOOL_PACKAGE_DIRECTORY: ${{ github.workspace }}/artifacts/release

    - name: Verify package
      shell: pwsh
      run: ./eng/Test-ToolPackage.ps1 -PackagePath artifacts/release/Meziantou.DocumentationGenerator.${{ steps.version.outputs.version }}.nupkg -ExpectedVersion ${{ steps.version.outputs.version }}

    - name: Generate the example site with the installed package
      shell: pwsh
      run: ./eng/New-SampleSite.ps1 -PackageDirectory artifacts/release -Version ${{ steps.version.outputs.version }} -OutputDirectory artifacts/site -BasePath "/${{ github.event.repository.name }}/" -SiteUrl "https://${{ github.repository_owner }}.github.io"

    - name: Write release notes
      shell: pwsh
      run: ./eng/New-ReleaseNotes.ps1 -Version ${{ steps.version.outputs.version }} -PackagePath artifacts/release/Meziantou.DocumentationGenerator.${{ steps.version.outputs.version }}.nupkg -OutputPath artifacts/release/RELEASE-NOTES.md

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: artifacts/release/
        if-no-files-found: error

    - name: Upload example site
      uses: actions/upload-pages-artifact@v4
      with:
        path: artifacts/site

  test:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - run: dotnet build Meziantou.DocumentationGenerator.slnx --configuration Release
    - run: pwsh tests/Meziantou.DocumentationGenerator.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium
    - run: dotnet test --solution Meziantou.DocumentationGenerator.slnx --configuration Release --no-build

  publish:
    needs: [validate, test]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # The environment holds the approval rules and the NuGet trusted publishing policy configured by the owner
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v5
      with:
        sparse-checkout: eng

    - name: Download the validated package
      uses: actions/download-artifact@v4
      with:
        name: release
        path: artifacts/release

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to NuGet
      shell: pwsh
      run: ./eng/Publish-NuGetPackage.ps1 -PackagePath artifacts/release/Meziantou.DocumentationGenerator.${{ needs.validate.outputs.version }}.nupkg -ApiKey "${{ steps.login.outputs.NUGET_API_KEY }}"

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the validated package
      uses: actions/download-artifact@v4
      with:
        name: release
        path: artifacts/release

    - name: Create or update the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        tag="v$VERSION"
        prerelease=""
        if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$tag" artifacts/release/* --clobber --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$tag" artifacts/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file artifacts/release/RELEASE-NOTES.md $prerelease
        fi

  deploy-site:
    needs: [validate, publish]
    if: vars.DOCGEN_DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy the example site
      id: deployment
      uses: actions/deploy-pages@v4
