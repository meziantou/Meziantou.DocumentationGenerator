name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DiffEngine_Disabled: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Build
      run: dotnet build Meziantou.DocumentationGenerator.slnx --configuration Release

    - name: Pack
      run: dotnet pack src/Meziantou.DocumentationGenerator/Meziantou.DocumentationGenerator.csproj --configuration Release --no-build --output ${{ github.workspace }}/artifacts/package

    - name: Install Chromium for browser tests
      run: pwsh tests/Meziantou.DocumentationGenerator.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    # The installed-tool tests use the package produced by the previous step
    - name: Test
      run: dotnet test --solution Meziantou.DocumentationGenerator.slnx --configuration Release --no-build
      env:
        DOCGEN_TOOL_PACKAGE_DIRECTORY: ${{ github.workspace }}/artifacts/package

    - name: Generate the example site with the installed package
      if: matrix.os == 'ubuntu-latest'
      shell: pwsh
      run: |
        $package = Get-ChildItem artifacts/package/Meziantou.DocumentationGenerator.*.nupkg | Select-Object -First 1
        $version = $package.BaseName.Substring('Meziantou.DocumentationGenerator.'.Length)
        ./eng/Test-ToolPackage.ps1 -PackagePath $package.FullName -ExpectedVersion $version
        ./eng/New-SampleSite.ps1 -PackageDirectory artifacts/package -Version $version -OutputDirectory artifacts/site -BasePath "/${{ github.event.repository.name }}/"

    - name: Upload example site
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: example-site
        path: artifacts/site

    - name: Upload package
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: artifacts/package/*.nupkg
        if-no-files-found: error

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**'
        if-no-files-found: ignore
